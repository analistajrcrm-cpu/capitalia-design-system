<!-- @dsCard group="Colors" viewport="700x180" name="Semánticos" subtitle="Derivados, desaturados para no competir con el naranja" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--green-600);"></div><div class="hex">Éxito</div><div class="sub">#4F7A52</div></div>
<div class="sw"><div class="chip" style="background:var(--amber-600);"></div><div class="hex">Aviso</div><div class="sub">#C08A2E</div></div>
<div class="sw"><div class="chip" style="background:var(--red-600);"></div><div class="hex">Error</div><div class="sub">#B33B2B</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-500);"></div><div class="hex">Acento de marca</div><div class="sub">#D86F3A</div></div>
</div><p style="margin-top:14px;font-size:12px;color:var(--text-muted)">No aparecen en el manual impreso: se derivaron para producto. El naranja nunca significa error.</p></body></html>
