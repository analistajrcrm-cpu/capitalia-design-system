<!-- @dsCard group="Shape" viewport="700x200" name="Movimiento" subtitle="Fundidos y desplazamientos cortos; ningún rebote" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><style>@keyframes cap-slide{0%,100%{transform:translateX(0)}50%{transform:translateX(140px)}}</style>
<div style="display:grid;gap:14px">
<div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;border-radius:999px;background:var(--orange-500);animation:cap-slide 2.4s var(--ease-standard) infinite"></div><div class="sub">--ease-standard cubic-bezier(.2,.7,.2,1)</div></div>
<div class="sub">--dur-instant 90 · --dur-fast 160 (hover) · --dur-base 240 (entradas) · --dur-slow 420 (paneles) · --dur-reveal 700 (revelado de foto)</div>
<div class="sub">Sin rebotes, sin escalados al pulsar: el press oscurece el relleno.</div>
</div></body></html>
