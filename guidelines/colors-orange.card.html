<!-- @dsCard group="Colors" viewport="700x180" name="Rampa naranja" subtitle="Acento único; 600/700 son hover y press" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--orange-700);"></div><div class="hex">700</div><div class="sub">#A64E22 · press</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-600);"></div><div class="hex">600</div><div class="sub">#C25F2E · hover</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-500);"></div><div class="hex">500</div><div class="sub">#D86F3A · manual</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-400);"></div><div class="hex">400</div><div class="sub">#E28D5F</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-200);"></div><div class="hex">200</div><div class="sub">#F2C4A9</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-100);"></div><div class="hex">100</div><div class="sub">#F9E4D7</div></div>
</div></body></html>
