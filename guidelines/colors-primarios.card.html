<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--plum-900);"></div><div class="hex">#311E34</div><div class="sub">plum-900 · RGB 49 30 52</div></div>
<div class="sw"><div class="chip" style="background:var(--orange-500);"></div><div class="hex">#D86F3A</div><div class="sub">orange-500 · RGB 216 111 58</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-200);"></div><div class="hex">#E9E3D8</div><div class="sub">bone-200 · RGB 233 227 216</div></div>
</div><p style="margin-top:16px;font:var(--type-body-sm);color:var(--text-muted)">CMYK 78 90 44 59 · 2 70 90 0 · 10 10 17 0. Proporción de uso: plum como fondo dominante, naranja como acento único, bone para texto y superficies claras.</p></body></html>
