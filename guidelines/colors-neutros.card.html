<!-- @dsCard group="Colors" viewport="700x180" name="Neutros y fondos" subtitle="Cremas, bones y la página" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--cream-50);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="hex">#FBF7F3</div><div class="sub">cream-50 · página</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-100);"></div><div class="hex">#F2EEE6</div><div class="sub">bone-100 · superficie</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-200);"></div><div class="hex">#E9E3D8</div><div class="sub">bone-200 · primario</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-300);"></div><div class="hex">#D8D1C3</div><div class="sub">bone-300 · borde</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-400);"></div><div class="hex">#C3BAA8</div><div class="sub">bone-400 · deshabilitado</div></div>
<div class="sw"><div class="chip" style="background:var(--bone-500);"></div><div class="hex">#A79D8A</div><div class="sub">bone-500 · texto sobre plum</div></div>
</div></body></html>
