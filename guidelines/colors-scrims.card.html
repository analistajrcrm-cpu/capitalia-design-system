<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
<div><div style="position:relative;height:120px;border-radius:var(--radius-md);overflow:hidden"><img src="../assets/img/parque-render.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:var(--plum-a60)"></div><span style="position:absolute;left:12px;bottom:10px;color:var(--bone-200);font:var(--type-label)">plum-a60</span></div><div class="sub" style="margin-top:6px">Scrim plano sobre foto completa</div></div>
<div><div style="position:relative;height:120px;border-radius:var(--radius-md);overflow:hidden"><img src="../assets/img/parque-render.png" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(49,30,52,.85),rgba(49,30,52,0) 65%)"></div><span style="position:absolute;left:12px;bottom:10px;color:var(--bone-200);font:var(--type-label)">degradado inferior</span></div><div class="sub" style="margin-top:6px">Único degradado permitido</div></div>
<div><div style="position:relative;height:120px;border-radius:var(--radius-md);overflow:hidden"><img src="../assets/img/parque-render.png" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;left:12px;bottom:10px;background:var(--bone-200);color:var(--plum-900);font:var(--type-label);padding:2px 10px;border-radius:999px 999px 0 999px">cápsula petal</span></div><div class="sub" style="margin-top:6px">Preferida sobre imagen con detalle</div></div>
</div></body></html>
