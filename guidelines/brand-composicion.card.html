<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page)}.grid{display:flex;gap:14px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:0}.chip{height:64px;border-radius:var(--radius-md)}.hex{font:var(--type-body-sm);font-size:12px;margin-top:8px;color:var(--text-primary);font-weight:var(--fw-medium)}.sub{font-size:11px;color:var(--text-muted);letter-spacing:.02em}</style></head><body><div style="position:relative;height:210px;border-radius:var(--radius-md);overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr">
<div style="background:var(--plum-900);padding:24px;position:relative;z-index:2">
<div style="font:var(--fw-bold) 30px/1.1 var(--font-sans);color:var(--bone-200);letter-spacing:-.01em">Una ciudad<br>no solo crece:<br>se planea</div>
<div style="position:absolute;left:24px;bottom:22px;font:var(--type-body-sm);color:var(--bone-300);max-width:26ch">Una ciudad planeada no solo se construye; se vive.</div>
<div style="position:absolute;right:-40px;top:0;bottom:0;width:80px;background:var(--plum-900);border-radius:0 999px 999px 0"></div>
</div>
<div style="position:relative"><img src="../assets/img/parque-render.png" style="width:100%;height:100%;object-fit:cover">
<img src="../assets/logo/lockup-horizontal-bone.png" style="position:absolute;right:16px;bottom:14px;height:22px">
<span style="position:absolute;right:16px;top:14px;background:var(--bone-200);color:var(--plum-900);font:var(--type-label);padding:3px 12px;border-radius:999px 999px 0 999px">capitalia.mx</span></div>
</div></body></html>
